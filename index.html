<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoursTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    <header class="header">
        <a href="#/" class="header-brand">
            <img src="assets/logo.png" alt="CoursTrack, suivi des cours" class="header-logo">
        </a>
        <div class="header-actions">
            <button id="btn-export" class="btn btn-ghost" type="button" title="Exporter les données">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Exporter
            </button>
            <label class="btn btn-ghost" title="Importer les données">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Importer
                <input type="file" id="btn-import" accept=".zip,.json" hidden>
            </label>
        </div>
    </header>

    <main id="app"></main>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close" class="modal-close" type="button" aria-label="Fermer">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <button id="modal-cancel" class="btn btn-secondary">Annuler</button>
                <button id="modal-confirm" class="btn btn-primary">Confirmer</button>
            </div>
        </section>
    </div>

    <script src="js/jszip.min.js?v=2"></script>
    <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
